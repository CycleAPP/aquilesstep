- name: nmap_ping_sweep
  display_name: "Nmap Ping Sweep"
  binary: nmap
  category: enumeration
  subcategory: host_discovery
  intensity: low
  command_template: "nmap -sn -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Discover live hosts without port scanning"
  requires_root: false
  timeout: 300
  assessment_types: [infrastructure, network_external, active_directory]
  tags: [hosts, discovery, ping]

- name: nmap_arp_discovery
  display_name: "Nmap ARP Discovery"
  binary: nmap
  category: enumeration
  subcategory: host_discovery
  intensity: low
  command_template: "nmap -PR -sn -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "ARP-based host discovery (local network)"
  requires_root: true
  timeout: 300
  assessment_types: [infrastructure, active_directory]
  tags: [hosts, discovery, arp, local]

- name: nmap_quick_scan
  display_name: "Nmap Quick Scan"
  binary: nmap
  category: enumeration
  subcategory: port_scan
  intensity: low
  command_template: "nmap -T4 -F -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Fast scan of top 100 ports"
  requires_root: false
  timeout: 300
  assessment_types: [web, infrastructure, bug_bounty, api, network_external]
  tags: [ports, quick, top100]

- name: nmap_service_scan
  display_name: "Nmap Service Detection"
  binary: nmap
  category: enumeration
  subcategory: service_detection
  intensity: medium
  command_template: "nmap -sV -sC -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Detect services, versions, and run default scripts"
  requires_root: false
  timeout: 600
  assessment_types: [web, infrastructure, bug_bounty, api, network_external]
  tags: [ports, services, versions, scripts]

- name: nmap_full_scan
  display_name: "Nmap Full Port Scan"
  binary: nmap
  category: enumeration
  subcategory: port_scan
  intensity: medium
  command_template: "nmap -p- -T4 -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Scan all 65535 TCP ports"
  requires_root: false
  timeout: 1800
  assessment_types: [infrastructure, network_external, active_directory]
  tags: [ports, full, comprehensive]

- name: nmap_version_scan
  display_name: "Nmap Version Intense"
  binary: nmap
  category: enumeration
  subcategory: service_detection
  intensity: medium
  command_template: "nmap -sV --version-intensity 5 -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Intense version detection on open ports"
  requires_root: false
  timeout: 600
  assessment_types: [web, infrastructure, api, network_external]
  tags: [services, versions, intense]

- name: nmap_udp_scan
  display_name: "Nmap UDP Scan"
  binary: nmap
  category: enumeration
  subcategory: port_scan
  intensity: medium
  command_template: "nmap -sU --top-ports 100 -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Scan top 100 UDP ports"
  requires_root: true
  timeout: 900
  assessment_types: [infrastructure, network_external]
  tags: [ports, udp, top100]

- name: nmap_script_scan
  display_name: "Nmap Script Scan (safe)"
  binary: nmap
  category: enumeration
  subcategory: scripting
  intensity: medium
  command_template: "nmap --script safe -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Run safe NSE scripts for additional enumeration"
  requires_root: false
  timeout: 600
  assessment_types: [web, infrastructure, api, network_external]
  tags: [scripts, nse, safe]

- name: nmap_vuln_scripts
  display_name: "Nmap Vulnerability Scripts"
  binary: nmap
  category: enumeration
  subcategory: vuln_scan
  intensity: high
  command_template: "nmap --script vuln -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Run NSE vulnerability detection scripts"
  requires_root: false
  timeout: 900
  assessment_types: [infrastructure, network_external]
  tags: [vuln, nse, scripts]

- name: nmap_smb_scripts
  display_name: "Nmap SMB Scripts"
  binary: nmap
  category: enumeration
  subcategory: smb
  intensity: medium
  command_template: "nmap -p 139,445 --script smb-enum-shares,smb-enum-users,smb-os-discovery -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "SMB enumeration scripts"
  requires_root: false
  timeout: 300
  assessment_types: [infrastructure, active_directory]
  tags: [smb, shares, users, windows]

- name: nmap_ad_scan
  display_name: "Nmap AD Discovery"
  binary: nmap
  category: enumeration
  subcategory: active_directory
  intensity: medium
  command_template: "nmap -p 53,88,135,139,389,445,464,593,636,3268,3269 -sV -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "Scan common Active Directory ports"
  requires_root: false
  timeout: 300
  assessment_types: [active_directory, infrastructure]
  tags: [active_directory, ports, ldap, kerberos]

- name: nmap_ldap_scripts
  display_name: "Nmap LDAP Scripts"
  binary: nmap
  category: enumeration
  subcategory: ldap
  intensity: medium
  command_template: "nmap -p 389,636,3268 --script ldap-rootdse,ldap-search -oX {output_file} {target}"
  output_format: xml
  parser: nmap
  description: "LDAP enumeration scripts"
  requires_root: false
  timeout: 300
  assessment_types: [active_directory, infrastructure]
  tags: [ldap, active_directory, enumeration]

- name: masscan_quick
  display_name: "Masscan Quick Scan"
  binary: masscan
  category: enumeration
  subcategory: port_scan
  intensity: high
  command_template: "masscan -p1-1000 --rate 1000 -oL {output_file} {target}"
  output_format: text
  parser: text
  description: "Fast SYN scan of top 1000 ports"
  requires_root: true
  timeout: 300
  assessment_types: [infrastructure, network_external]
  tags: [ports, fast, syn]
