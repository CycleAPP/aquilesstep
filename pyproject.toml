[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquiles"
version = "1.0.0"
description = "AI-Assisted Pentesting Orchestrator"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[project.scripts]
aquiles = "aquiles.cli:main"

[tool.setuptools.packages.find]
where = ["."]
